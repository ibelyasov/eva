name: Статические проверки

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  whitespace:
    name: Пробелы в дереве Git
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получить исходники
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Проверить пробелы во всём дереве
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
